# Netlify deployment — Nuxt 4 static site (nuxt generate)
[build]
  command = "npm install --legacy-peer-deps --no-audit --no-fund && npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
