# Netlify deployment — Nuxt 4 static site (nuxt generate)
[build]
  command = "npm install --legacy-peer-deps --no-audit --no-fund && npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# SPA fallback for client-side routing
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
